name: Daily job discovery
on:
  schedule:
    - cron: "0 0 * * *" # 08:00 Asia/Shanghai; GitHub scheduling can be delayed.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/search.mjs
      - .github/workflows/daily.yml
permissions:
  contents: write
concurrency:
  group: daily-jobs
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate core workflows before using search quota
        run: npm test && npm run test:ui
      - name: Refresh public job discovery index
        run: npm run jobs:refresh
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          JOB_SOURCE_MODE: ${{ vars.JOB_SOURCE_MODE }}
          JOB_ROLE: ${{ vars.JOB_ROLE }}
          JOB_CITY: ${{ vars.JOB_CITY }}
          JOB_REGION: ${{ vars.JOB_REGION }}
          JOB_EXCLUDE: ${{ vars.JOB_EXCLUDE }}
          JOB_EMPLOYMENT: ${{ vars.JOB_EMPLOYMENT }}
          JOB_EXPERIENCE: ${{ vars.JOB_EXPERIENCE }}
          JOB_SEARCH_BUDGET: ${{ vars.JOB_SEARCH_BUDGET }}
          JOB_SEARCH_PAGES: ${{ vars.JOB_SEARCH_PAGES }}
          JOB_BROWSER_RENDER: "true"
          JOB_DETAIL_LIMIT: ${{ vars.JOB_DETAIL_LIMIT }}
      - name: Save public job index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/save-index.mjs
      # GITHUB_TOKEN pushes do not trigger another workflow; explicitly build and deploy the refreshed site.
      - run: npm test && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    concurrency:
      group: github-pages
      cancel-in-progress: false
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
